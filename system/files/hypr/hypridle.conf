# MomOS idle rules for her session, run by momos-idle.service.
#
# Written by system/install.sh (step "session"). Edit the copy in the MomOS
# repo and redeploy.
#
# hypridle honors idle inhibitors (Wayland, D-Bus ScreenSaver and systemd), so
# a playing video or a call holds all of this off.
#
# The lid belongs to momd: while momd says the lid is closed, momos-idle
# leaves the screen off and doesn't suspend, and momd suspends after 30
# minutes closed. See ~<admin>/MACHINE-NOTES.md.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# 3 minutes: photo screensaver.
listener {
    timeout = 180
    on-timeout = /usr/local/lib/momos/momos-idle screensaver-on
    on-resume = /usr/local/lib/momos/momos-idle screensaver-off
}

# 15 minutes: screen off.
listener {
    timeout = 900
    on-timeout = /usr/local/lib/momos/momos-idle screen-off
    on-resume = /usr/local/lib/momos/momos-idle screen-on
}

# 30 minutes: sleep, but only on battery. On AC power momos-idle leaves the
# laptop awake with the screen off, so the helper can reach it remotely.
listener {
    timeout = 1800
    on-timeout = /usr/local/lib/momos/momos-idle suspend
}
